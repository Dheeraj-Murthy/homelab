- Infrastructure:
    - Homepage:
        icon: homepage
        href: http://{{HOMEPAGE_VAR_HOSTNAME}}:3000
        description: Dashboard
    - Portainer:
        icon: portainer
        href: https://{{HOMEPAGE_VAR_HOSTNAME}}:9443
        description: Container management
        widget:
          type: portainer
          url: http://portainer:9000
          env: {{HOMEPAGE_VAR_PORTAINER_ENV}}
          key: {{HOMEPAGE_VAR_PORTAINER_KEY}}
    - Networking:
        - AdGuard Home:
            icon: adguard-home
            href: http://{{HOMEPAGE_VAR_HOSTNAME}}:3053
            description: DNS ad-blocking for the tailnet
            widget:
              type: adguard
              url: http://adguard:80
              username: {{HOMEPAGE_VAR_ADGUARD_USERNAME}}
              password: {{HOMEPAGE_VAR_ADGUARD_PASSWORD}}

- Monitoring:
    - Grafana:
        icon: grafana
        href: http://{{HOMEPAGE_VAR_HOSTNAME}}:3001
        description: Metrics dashboards
        widget:
          type: grafana
          url: http://host.docker.internal:3001
          username: {{HOMEPAGE_VAR_GRAFANA_USERNAME}}
          password: {{HOMEPAGE_VAR_GRAFANA_PASSWORD}}
    - Prometheus:
        icon: prometheus
        href: http://{{HOMEPAGE_VAR_HOSTNAME}}:9090
        description: Time-series database
        widget:
          type: prometheus
          url: http://host.docker.internal:9090
    - Glances:
        icon: glances
        href: http://{{HOMEPAGE_VAR_HOSTNAME}}:61208
        description: Host system stats
        widget:
          type: iframe
          name: glances-dashboard
          src: http://{{HOMEPAGE_VAR_HOSTNAME}}:61208
          classes: h-64 sm:h-64 md:h-64 lg:h-64 xl:h-64 2xl:h-72
          refreshInterval: 5000
          allowScrolling: yes

- Storage:
    - File Browser:
        icon: filebrowser
        href: http://{{HOMEPAGE_VAR_HOSTNAME}}:8090
        description: Web file manager
    - PairDrop:
        icon: pairdrop
        href: http://{{HOMEPAGE_VAR_HOSTNAME}}:8082
        description: AirDrop-style file & clipboard sharing
    - Samba:
        icon: samba-server
        href: smb://{{HOMEPAGE_VAR_HOSTNAME}}/Shared
        description: Network share (SMB)

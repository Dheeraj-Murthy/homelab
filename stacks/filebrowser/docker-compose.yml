services:
  filebrowser:
    image: filebrowser/filebrowser:latest
    container_name: filebrowser
    restart: unless-stopped
    environment:
      PUID: 1000
      PGID: 1000
    volumes:
      - ../../shared:/srv
      - ./config:/config
      - ./database:/database
    ports:
      - 8090:80

networks:
  default:
    external: true
    name: homelab

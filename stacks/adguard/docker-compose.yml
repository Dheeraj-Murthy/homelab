services:
  adguard:
    image: adguard/adguardhome
    container_name: adguard
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./config:/opt/adguardhome/conf
      - ./data:/opt/adguardhome/work
    ports:
      - "${TAILSCALE_IP}:53:53/tcp"
      - "${TAILSCALE_IP}:53:53/udp"
      - "${TAILSCALE_IP}:3053:80/tcp"
    healthcheck:
      test: ["CMD-SHELL", "wget -T 5 -qO /dev/null http://1.1.1.1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    labels:
      - autoheal=true

networks:
  default:
    external: true
    name: homelab
